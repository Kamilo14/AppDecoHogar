name: app_deco_hogar
description: App de gestión para emprendimiento de decoración para el hogar
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.21
  sqlite3: ^3.5.0
  path_provider: ^2.1.3
  path: ^1.9.0
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^12.0.2
  file_picker: ^8.0.0
  intl: ^0.19.0
  fl_chart: ^1.2.0
  google_fonts: ^8.2.0
  image_picker: ^1.1.2
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
